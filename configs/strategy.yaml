# ═══════════════════════════════════════════════════════════════════════════
# NSE Algo Trader — Strategy Configuration  (Phase 2.1 Multi-Strategy)
# ═══════════════════════════════════════════════════════════════════════════

# ── Shared / Global ──────────────────────────────────────────────────────────
session:
  start: "09:45"   # skip opening 30-min noise
  end: "15:10"     # no new entries in final 20 min

vix:
  high: 25.0       # max VIX for most strategies
  elevated: 20.0   # "elevated" VIX marker

regime:
  adx_trending_threshold: 20.0   # ADX > 20 = trending market

# ── Phase 2.1 Orchestrator ────────────────────────────────────────────────────
phase21:
  # Toggle strategies on/off without restarting
  enabled_strategies:
    # Directional
    - momentum
    - trend_following
    - breakout
    - mean_reversion
    - volatility_contraction
    - range_trading
    - relative_strength
    - gap_trading
    - price_action
    - swing_trading
    # Options — Bullish
    - buy_call
    - sell_put
    - bull_call_spread
    - bull_put_spread
    - call_back_spread
    - call_front_spread
    # Options — Bearish
    - buy_put
    - sell_call
    - bear_put_spread
    - bear_call_spread
    - put_back_spread
    - put_front_spread
    # Options — Neutral
    - iron_condor
    - short_iron_butterfly
    - short_iron_wonder
    - short_straddle
    - short_strangle
    - long_call_butterfly
    - long_calendar

# ── 1. Momentum (Phase 1 — EMA crossover) ────────────────────────────────────
momentum:
  fast_ema: 9
  slow_ema: 21
  volume_filter_ratio: 1.2
  stop_atr_multiplier: 2.0
  target_atr_multiplier: 3.0

entry:
  min_confidence: 0.55
  require_bar_confirmation: false
  rsi_long_min: 45.0
  rsi_long_max: 70.0
  rsi_short_min: 30.0
  rsi_short_max: 55.0

# ── 2. Trend Following (enhanced EMA + MACD + EMA200) ────────────────────────
trend_following:
  adx_max: 50.0
  require_ema200_align: true   # only trade in direction of long-term EMA200 trend
  require_macd_confirm: true   # MACD histogram must agree with crossover direction

# ── 3. Breakout (Donchian Channel) ───────────────────────────────────────────
breakout:
  channel_period: 20          # Donchian channel lookback (Turtle Trading standard)
  volume_ratio: 1.5           # vol_ratio >= 1.5 (institutional participation)
  adx_min: 20.0               # trend must be forming — breakouts succeed ~60% in trends
  adx_max: 50.0               # avoid late-stage trend exhaustion breakouts
  stop_atr_mult: 1.5          # tight stop — if breakout fails quickly, exit fast
  target_atr_mult: 3.0        # 2:1 R:R (minimum for positive expectancy at 40% win rate)
  min_confidence: 0.55
  vix_max: 28.0               # slightly higher VIX OK — breakouts happen in fearful markets

# ── 4. Mean Reversion (BB + RSI in ranging markets) ──────────────────────────
mean_reversion:
  bb_period: 20               # Bollinger Band lookback
  bb_std: 2.0                 # standard 2-sigma bands
  rsi_oversold: 35.0          # RSI < 35 for long (not 30 — more signals, still valid)
  rsi_overbought: 65.0        # RSI > 65 for short
  adx_max: 22.0               # only trade reversion in ranging markets (ADX < 22)
  stop_atr_mult: 1.5          # tight stop — reversion should happen quickly
  min_confidence: 0.55
  vix_max: 25.0

# ── 5. Volatility Contraction (BB Squeeze) ───────────────────────────────────
volatility_contraction:
  min_squeeze_bars: 3         # min consecutive squeeze bars before entry
  volume_ratio: 1.5           # vol_ratio >= 1.5 on breakout bar
  atr_ratio_max: 0.75         # ATR < 75% of 20-bar ATR mean = compression
  stop_atr_mult: 2.0          # wider stop — post-squeeze volatility is elevated
  target_atr_mult: 3.0        # 1.5:1 R:R; justified by ~65% follow-through rate
  min_confidence: 0.55
  vix_max: 30.0

# ── 6. Range Trading (Pivot S/R band trading) ────────────────────────────────
range_trading:
  proximity_pct: 0.005        # within 0.5% of S/R to qualify as a "touch"
  adx_max: 22.0               # ranging market only
  min_range_pct: 0.005        # min 0.5% range width (reward > transaction costs)
  stop_pct: 0.007             # 0.7% hard stop beyond S/R level
  target_range_frac: 0.85     # target = 85% of range width toward opposite band
  rsi_long_max: 55.0          # not overbought when buying support
  rsi_short_min: 45.0         # not oversold when shorting resistance
  min_confidence: 0.52
  vix_max: 20.0               # only in calm, low-VIX environments

# ── 7. Relative Strength (RS vs Nifty) ───────────────────────────────────────
relative_strength:
  rs_momentum_min: 0.02       # RS must outperform/underperform by >= 2% over 20 bars
  rs_momentum_period: 20      # bars for RS rate-of-change calculation
  volume_ratio: 1.2           # light volume OK — RS entry is pullback-based
  stop_atr_mult: 2.0
  target_atr_mult: 3.0
  pullback_dist_min: -0.01    # dist_ema_21 >= -1% (price at or below EMA21)
  pullback_dist_max: 0.005    # dist_ema_21 <= +0.5% (close to EMA21)
  min_confidence: 0.55
  vix_max: 25.0

# ── 8. Gap Trading (open gap continuation and fade) ──────────────────────────
gap_trading:
  gap_continuation_min: 0.010  # >= 1.0% gap triggers continuation mode
  gap_fade_min: 0.005          # >= 0.5% gap triggers fade consideration
  vol_continuation_min: 2.0    # 2× average volume needed for continuation
  stop_cont_atr_mult: 2.0      # continuation stop
  target_cont_atr_mult: 2.5    # continuation target
  stop_fade_atr_mult: 1.5      # fade stop (tight — gap fill is fast or it fails)
  gap_session_end: "10:15"     # gap trades only valid in first 60 minutes
  min_confidence: 0.52
  vix_max: 30.0

# ── 9. Price Action (Candlestick patterns at S/R) ────────────────────────────
price_action:
  sr_proximity_pct: 0.005      # within 0.5% of pivot S/R level
  volume_confirm: 1.2          # volume confirmation (light OK for PA)
  stop_atr_mult: 1.0           # tight stop — pattern failure = immediate exit
  target_atr_mult: 2.0         # 2:1 R:R to next S/R level
  min_confidence: 0.52
  vix_max: 28.0

# ── 10. Swing Trading (EMA-pullback, multi-bar hold) ─────────────────────────
swing_trading:
  pullback_low_pct: -0.010     # dist_ema_21 must be >= -1% (not more than 1% below EMA21)
  pullback_high_pct: 0.005     # dist_ema_21 must be <= +0.5% (near EMA21, not extended)
  rsi_min: 40.0                # not oversold momentum
  rsi_max: 60.0                # not overbought — fresh momentum remaining
  adx_min: 20.0                # trending market
  adx_max: 40.0                # not in blowoff top
  pullback_vol_max: 0.9        # low volume on pullback = healthy retracement (not distribution)
  stop_atr_mult: 2.5           # wider stop for multi-bar swing
  target_atr_mult: 5.0         # larger target for swing holding period
  min_confidence: 0.55
  vix_max: 22.0

# ═══════════════════════════════════════════════════════════════════════════
# OPTIONS STRATEGIES — all 19 strategies across Bullish / Bearish / Neutral
# ═══════════════════════════════════════════════════════════════════════════

options_common:
  dte: 7                       # Default DTE for weekly NSE options
  # EM formula: EM = close × (VIX/100) × sqrt(DTE/365)
  # Example — Nifty 23000, VIX=18, DTE=7: EM ≈ ±574 points
  # Strike intervals: Nifty=50pts, BankNifty=100pts, Stocks≈5pts

# ── BULLISH OPTIONS ────────────────────────────────────────────────────────────

buy_call:
  adx_min: 20.0                # trending market
  vix_max: 20.0                # buy call when IV cheap (VIX < 20)
  strike_sd: 0.0               # ATM call

sell_put:
  adx_max: 30.0                # not extreme trend
  vix_min: 16.0                # sell premium when IV elevated
  strike_sd: 1.0               # 1.0-SD OTM put (~0.16 delta)

bull_call_spread:
  adx_min: 20.0
  vix_max: 25.0
  long_sd: 0.0                 # buy ATM call
  short_sd: 1.0                # sell 1.0-SD OTM call

bull_put_spread:
  vix_min: 15.0                # need IV for premium
  adx_min: 20.0
  short_sd: 0.8                # sell 0.8-SD OTM put
  long_sd: 1.5                 # buy 1.5-SD OTM put wing

call_back_spread:
  adx_min: 25.0                # strong bullish momentum required
  vix_max: 18.0                # buy cheap back options
  sell_sd: 0.5                 # sell 0.5-SD OTM call (1 lot)
  buy_sd: 1.0                  # buy 1.0-SD OTM call (ratio lots)
  ratio: 2                     # 1 sell : 2 buy

call_front_spread:
  adx_min: 15.0
  vix_min: 20.0                # sell expensive OTM calls
  buy_sd: 0.0                  # buy ATM call
  sell_sd: 1.0                 # sell 1.0-SD OTM call ×2

# ── BEARISH OPTIONS ────────────────────────────────────────────────────────────

buy_put:
  adx_min: 20.0
  vix_max: 20.0
  strike_sd: 0.0               # ATM put

sell_call:
  adx_max: 30.0
  vix_min: 16.0
  strike_sd: 1.0               # 1.0-SD OTM call

bear_put_spread:
  adx_min: 20.0
  vix_max: 25.0
  long_sd: 0.0                 # buy ATM put
  short_sd: 1.0                # sell 1.0-SD OTM put

bear_call_spread:
  vix_min: 15.0
  adx_min: 20.0
  sell_sd: 0.8                 # sell 0.8-SD OTM call
  buy_sd: 1.5                  # buy 1.5-SD OTM call wing

put_back_spread:
  adx_min: 25.0
  vix_max: 18.0
  sell_sd: 0.5                 # sell 0.5-SD OTM put (1 lot)
  buy_sd: 1.0                  # buy 1.0-SD OTM put (ratio lots)
  ratio: 2                     # 1 sell : 2 buy

put_front_spread:
  adx_min: 15.0
  vix_min: 20.0
  buy_sd: 0.0                  # buy ATM put
  sell_sd: 1.0                 # sell 1.0-SD OTM put ×2

# ── NEUTRAL OPTIONS ────────────────────────────────────────────────────────────

iron_condor:
  adx_max: 20.0
  vix_min: 15.0
  vix_max: 35.0
  sd_short: 1.5                # sell at ±1.5 SD
  sd_wing: 2.0                 # buy wings at ±2.0 SD
  dte: 7
  # EM example: Nifty 23000, VIX=18, DTE=7 → EM≈574 → sell call at 23850, put at 22150

short_iron_butterfly:
  adx_max: 15.0                # very flat market
  vix_min: 20.0                # sell expensive ATM premium
  wing_sd: 1.0                 # buy wings at ±1.0 SD

short_iron_wonder:
  adx_max: 20.0
  vix_min: 18.0
  call_sd: 1.5                 # sell ATM call, buy 1.5-SD call wing
  put_sd: 0.5                  # sell 0.5-SD OTM put (closer to ATM = more premium)
  put_wing_sd: 1.5             # buy 1.5-SD OTM put wing

short_straddle:
  adx_max: 12.0                # extreme flat
  vix_min: 25.0                # sell very expensive ATM straddle
  # WARNING: unlimited risk — use only post-event with expected rapid IV collapse

short_strangle:
  adx_max: 12.0
  vix_min: 22.0
  strike_sd: 1.5               # sell at ±1.5 SD OTM

long_call_butterfly:
  adx_max: 20.0
  vix_max: 18.0                # buy when IV cheap
  wing_sd: 0.5                 # wings at ±0.5 SD from ATM

long_calendar:
  adx_max: 25.0
  vix_max: 20.0                # don't buy far-month when VIX high

# ── Walk-Forward Validator (Phase 2) ─────────────────────────────────────────
phase2:
  sentiment_bearish_block: -0.3
  sentiment_bullish_block: 0.3
  sentiment_cache_ttl_s: 300
  xgb_n_estimators: 500
  xgb_max_depth: 4
  xgb_learning_rate: 0.05
  xgb_subsample: 0.8
  wfv_train_bars: 2000
  wfv_test_bars: 500
  wfv_n_windows: 5
  wfv_dsr_threshold: 1.0
