primary_timeframe_min: 5     # primary strategy timeframe (minutes)
timeframes_min: [1, 5, 15, 1440]

signal_confidence_threshold: 0.6   # minimum alpha score to enter a trade
target_bars_ahead: 3               # prediction horizon for direction model

# Regime thresholds
regime:
  adx_trending_threshold: 25       # ADX > 25 = trending
  adx_ranging_threshold: 20        # ADX < 20 = ranging

# India VIX regime levels
vix:
  very_low: 12        # mean reversion strategies preferred
  normal_low: 15      # momentum strategies preferred
  elevated: 20        # reduce position size
  high: 25            # options premium selling opportunities
  extreme: 30         # flatten aggressive positions / halt

# Momentum strategy (Phase 1 — simple EMA crossover)
momentum:
  fast_ema: 9
  slow_ema: 21
  volume_filter_ratio: 1.2    # volume must be > 1.2× 20-bar MA to confirm entry
  stop_atr_multiplier: 2.0    # stop-loss = 2 × ATR below entry
  target_atr_multiplier: 3.0  # take-profit = 3 × ATR above entry (1.5 R:R)

# Mean reversion strategy (Phase 2)
mean_reversion:
  bb_period: 20
  bb_std: 2.0
  rsi_oversold: 30
  rsi_overbought: 70
